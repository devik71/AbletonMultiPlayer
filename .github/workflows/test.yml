name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            daemon/package-lock.json
            relay/package-lock.json

      - name: Install daemon dependencies
        run: npm ci --prefix daemon

      - name: Install relay dependencies
        run: npm ci --prefix relay

      - name: Node test suite
        run: npm test

      # Лише формат і цілісність. `verify` тут не місце: він питає локальний
      # Live, якого в CI немає, -- і завалив би збірку на кожній машині.
      - name: Project memory
        run: node tools/memory.mjs check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remote Script syntax
        shell: pwsh
        run: >-
          python -c "import ast,pathlib;
          [ast.parse(p.read_text(encoding='utf-8-sig'))
          for p in pathlib.Path('remote-script/AbletonMP').glob('*.py')];
          print('Python syntax OK')"
